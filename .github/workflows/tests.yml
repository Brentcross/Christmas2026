name: Tests

# The sealing and game-state tests, on the sample hunt only. Never give this workflow the MC passphrase: the repo is
# public, so its logs are too, and the end-to-end test prints station titles. Run that one on your own computer.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Sealing
        run: node tools/seal-test.mjs

      - name: Game state
        run: node tools/store-test.mjs
